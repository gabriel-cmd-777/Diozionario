<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diozionario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12151c;
    --ink-2: #1a1f29;
    --card: #ece4d0;
    --card-shadow: #05060a;
    --stamp: #7a2e2e;
    --paper-line: #c9bd9c;
    --text-dim: #8b8f9c;
    --text-bright: #e9e6dd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    background-image: radial-gradient(circle at 50% 0%, #1c212c 0%, var(--ink) 60%);
    color: var(--text-bright);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  header { margin-bottom: 40px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-dim); margin: 0 0 8px;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px;
    margin: 0 0 10px; color: var(--text-bright); letter-spacing: -0.01em;
  }
  .lede { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin: 0; }

  .controls { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
  .row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; background: var(--ink-2); border: 1px solid #333a48; color: var(--text-bright);
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 12px 14px;
    border-radius: 2px; outline: none;
  }
  input[type=text]:focus { border-color: var(--stamp); }
  button {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em;
    text-transform: uppercase; cursor: pointer; border-radius: 2px; padding: 12px 16px;
    border: 1px solid #333a48; background: var(--ink-2); color: var(--text-bright);
    transition: border-color .15s ease, background .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--text-dim); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--stamp); border-color: var(--stamp); color: #f2e9e2; flex: 1; }
  button.primary:hover:not(:disabled) { background: #8f3535; }
  button.ghost { background: transparent; }

  .status { font-size: 12px; color: var(--text-dim); min-height: 16px; margin: -4px 0 0; }
  .status.error { color: #d98a8a; }

  .card {
    position: relative;
    background: var(--card);
    color: #1f1b14;
    border-radius: 1px;
    padding: 30px 26px 24px;
    box-shadow: 0 18px 40px -12px var(--card-shadow), 0 0 0 1px #d8cca8 inset;
    margin-bottom: 28px;
    display: none;
  }
  .card.visible { display: block; }
  .card::before {
    content: ''; position: absolute; top: 14px; left: 14px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink); box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
  }
  .stamp {
    position: absolute; top: 20px; right: 22px;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--stamp); border: 1px solid var(--stamp); padding: 3px 7px;
    transform: rotate(-6deg); opacity: 0.85; white-space: nowrap;
  }
  .headword {
    font-family: 'Fraunces', serif; font-weight: 600; font-style: italic;
    font-size: 24px; margin: 6px 60px 4px 22px; color: #1f1b14;
  }
  .rule { border: none; border-top: 1px dashed var(--paper-line); margin: 14px 0; }
  .definition {
    font-family: 'Fraunces', serif; font-size: 17px; line-height: 1.55; margin: 0 0 4px;
  }
  .meta { font-size: 11px; color: #6b6350; letter-spacing: 0.03em; margin-top: 10px; }

  .card-actions { display: flex; gap: 8px; margin-top: 18px; }
  .card-actions button { font-size: 11px; padding: 9px 12px; }

  .history { margin-top: 44px; }
  .history h2 {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); font-weight: 500;
    border-bottom: 1px solid #262c38; padding-bottom: 10px; margin: 0 0 4px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .history h2 button { font-size: 10px; padding: 4px 8px; }
  .hist-item {
    padding: 12px 0; border-bottom: 1px solid #20252f; font-size: 13px;
    cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  }
  .hist-item:hover .hist-text { color: var(--text-bright); }
  .hist-text { color: #b9bcc7; font-family: 'Fraunces', serif; font-style: italic; }
  .hist-date { color: #565c6b; font-size: 10px; flex-shrink: 0; }
  .empty { color: #565c6b; font-size: 12px; padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Innesto definitorio · fonte: Wikizionario</p>
    <h1>Definizioni innestate</h1>
    <p class="lede">Scegli un definiendum, poi genera un innesto: una definizione vera, presa a caso da un altro lemma, trapiantata sulla tua parola.</p>
  </header>

  <div class="controls">
    <div class="row">
      <input type="text" id="definiendum" placeholder="definiendum (es. esistere)" autocomplete="off">
      <button id="randomWordBtn" title="Definiendum casuale">Casuale</button>
    </div>
    <button class="primary" id="generateBtn">Genera innesto</button>
    <p class="status" id="status"></p>
  </div>

  <div class="card" id="card">
    <div class="stamp" id="stampText">&lt; ?</div>
    <div class="headword" id="cardHeadword">—</div>
    <hr class="rule">
    <p class="definition" id="cardDefinition">—</p>
    <p class="meta" id="cardMeta"></p>
    <div class="card-actions">
      <button id="copyWithSource">Copia con promemoria</button>
      <button id="copyClean" class="ghost">Copia per pubblicazione</button>
    </div>
  </div>

  <div class="history">
    <h2>Storico <button id="clearHistory">Svuota</button></h2>
    <div id="historyList"><p class="empty">Nessun innesto ancora salvato.</p></div>
  </div>
</div>

<script>
const API = 'https://it.wiktionary.org/w/api.php';
const STORAGE_KEY = 'definizioni-innestate-storico';
let current = null;

const statusEl = document.getElementById('status');
const cardEl = document.getElementById('card');
const generateBtn = document.getElementById('generateBtn');
const randomWordBtn = document.getElementById('randomWordBtn');
const definiendumInput = document.getElementById('definiendum');

function setStatus(msg, isError) {
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}

async function fetchRandomTitle() {
  const url = `${API}?action=query&generator=random&grnnamespace=0&grnlimit=1&format=json&origin=*`;
  const res = await fetch(url);
  const data = await res.json();
  const pages = data.query && data.query.pages;
  if (!pages) return null;
  const page = Object.values(pages)[0];
  return page ? page.title : null;
}

async function fetchWikitext(title) {
  const url = `${API}?action=query&titles=${encodeURIComponent(title)}&prop=revisions&rvprop=content&rvslots=main&format=json&origin=*`;
  const res = await fetch(url);
  const data = await res.json();
  const pages = data.query && data.query.pages;
  if (!pages) return null;
  const page = Object.values(pages)[0];
  if (!page || !page.revisions) return null;
  const slots = page.revisions[0].slots;
  return slots && slots.main ? slots.main['*'] : null;
}

function stripWikitext(s) {
  let t = s;
  for (let i = 0; i < 6; i++) {
    const before = t;
    t = t.replace(/\{\{[^{}]*\}\}/g, '');
    if (t === before) break;
  }
  t = t.replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g, '$1');
  t = t.replace(/\[\[([^\]]*)\]\]/g, '$1');
  t = t.replace(/'''([^']*)'''/g, '$1');
  t = t.replace(/''([^']*)''/g, '$1');
  t = t.replace(/<[^>]+>/g, '');
  t = t.replace(/\s{2,}/g, ' ').trim();
  return t;
}

function extractItalianDefinitions(wikitext) {
  const secMatch = wikitext.match(/\{\{-it-\}\}[\s\S]*?(?=\n==[^=]|\n\{\{-\w\w-\}\}|$)/);
  if (!secMatch) return [];
  const section = secMatch[0];
  const lines = section.split('\n');
  const defs = [];
  for (const line of lines) {
    const m = line.match(/^#{1,2}(?!\s*[:*])\s*(.+)/);
    if (!m) continue;
    const cleaned = stripWikitext(m[1]);
    if (cleaned.length >= 6 && !cleaned.includes('{{') && !cleaned.includes('[[')) {
      defs.push(cleaned);
    }
  }
  return defs;
}

async function findRandomDefinition(maxAttempts) {
  for (let i = 0; i < maxAttempts; i++) {
    setStatus(`ricerca in corso… (tentativo ${i + 1})`);
    const title = await fetchRandomTitle();
    if (!title || /^(Appendice|Categoria|Wikizionario|Modulo|Template|MediaWiki):/i.test(title)) continue;
    const wikitext = await fetchWikitext(title);
    if (!wikitext) continue;
    const defs = extractItalianDefinitions(wikitext);
    if (defs.length === 0) continue;
    const def = defs[Math.floor(Math.random() * defs.length)];
    return { lemma: title, definizione: def };
  }
  return null;
}

async function onGenerate() {
  const definiendum = definiendumInput.value.trim();
  if (!definiendum) {
    setStatus('scrivi prima un definiendum, o premi "Casuale".', true);
    return;
  }
  generateBtn.disabled = true;
  randomWordBtn.disabled = true;
  try {
    const result = await findRandomDefinition(10);
    if (!result) {
      setStatus('nessuna definizione trovata dopo vari tentativi. riprova.', true);
      return;
    }
    setStatus('');
    current = { definiendum, definizione: result.definizione, fonte: result.lemma, data: new Date().toISOString() };
    renderCard(current);
    saveToHistory(current);
    renderHistory();
  } catch (e) {
    setStatus('errore di rete durante l\'accesso a Wikizionario.', true);
  } finally {
    generateBtn.disabled = false;
    randomWordBtn.disabled = false;
  }
}

async function onRandomWord() {
  randomWordBtn.disabled = true;
  setStatus('cerco una parola…');
  try {
    let title = null;
    for (let i = 0; i < 6 && !title; i++) {
      const t = await fetchRandomTitle();
      if (t && /^[a-zàèéìòù'-]+$/i.test(t)) title = t;
    }
    if (title) definiendumInput.value = title;
    setStatus('');
  } catch (e) {
    setStatus('errore nel recupero della parola casuale.', true);
  } finally {
    randomWordBtn.disabled = false;
  }
}

function renderCard(entry) {
  document.getElementById('stampText').textContent = `< ${entry.fonte}`;
  document.getElementById('cardHeadword').textContent = entry.definiendum;
  document.getElementById('cardDefinition').textContent = entry.definizione;
  document.getElementById('cardMeta').textContent = 'promemoria: non includere nella pubblicazione';
  cardEl.classList.add('visible');
}

function fullText(entry) {
  return `${entry.definiendum}: ${entry.definizione} (< ${entry.fonte})`;
}
function cleanText(entry) {
  return `${entry.definiendum}: ${entry.definizione}`;
}

document.getElementById('copyWithSource').addEventListener('click', () => {
  if (!current) return;
  navigator.clipboard.writeText(fullText(current));
  setStatus('copiato (con promemoria).');
});
document.getElementById('copyClean').addEventListener('click', () => {
  if (!current) return;
  navigator.clipboard.writeText(cleanText(current));
  setStatus('copiato (senza fonte).');
});

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function saveToHistory(entry) {
  const hist = loadHistory();
  hist.unshift(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(hist.slice(0, 200)));
}
function renderHistory() {
  const hist = loadHistory();
  const el = document.getElementById('historyList');
  if (hist.length === 0) {
    el.innerHTML = '<p class="empty">Nessun innesto ancora salvato.</p>';
    return;
  }
  el.innerHTML = '';
  hist.forEach((entry) => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    const date = new Date(entry.data);
    const dateStr = date.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: '2-digit' });
    div.innerHTML = `<span class="hist-text">${entry.definiendum}: ${entry.definizione}</span><span class="hist-date">${dateStr}</span>`;
    div.addEventListener('click', () => {
      current = entry;
      renderCard(entry);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    el.appendChild(div);
  });
}

document.getElementById('clearHistory').addEventListener('click', () => {
  if (confirm('Svuotare tutto lo storico?')) {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  }
});

generateBtn.addEventListener('click', onGenerate);
randomWordBtn.addEventListener('click', onRandomWord);
definiendumInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') onGenerate(); });

renderHistory();
</script>
</body>
</html>
