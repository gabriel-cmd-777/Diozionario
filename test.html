<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Test dizionari originali</title>
<style>
  body { font-family: monospace; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #111; color: #ddd; }
  .site { margin: 24px 0; padding: 16px; border: 1px solid #333; }
  .name { font-weight: bold; margin-bottom: 8px; }
  .ok { color: #7fd97f; }
  .fail { color: #e07a7a; }
  pre { white-space: pre-wrap; font-size: 12px; color: #888; }
  button { background: #222; color: #ddd; border: 1px solid #555; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>Test fetch diretto — parola: baluginare</h1>
<button onclick="run()">Esegui test</button>
<div class="site">
  <div class="name">De Mauro (dizionario.internazionale.it)</div>
  <div id="demauro">non testato</div>
</div>
<div class="site">
  <div class="name">Olivetti (dizionario-italiano.it)</div>
  <div id="olivetti">non testato</div>
</div>

<script>
async function testUrl(url) {
  try {
    const res = await fetch(url);
    const text = await res.text();
    return { ok: true, status: res.status, length: text.length };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

async function run() {
  document.getElementById('demauro').textContent = 'in corso...';
  document.getElementById('olivetti').textContent = 'in corso...';

  const r1 = await testUrl('https://dizionario.internazionale.it/parola/baluginare');
  document.getElementById('demauro').innerHTML = r1.ok
    ? `<span class="ok">✓ accesso diretto OK</span> (status ${r1.status}, ${r1.length} caratteri)`
    : `<span class="fail">✗ bloccato</span><pre>${r1.error}</pre>`;

  const r2 = await testUrl('https://www.dizionario-italiano.it/dizionario-italiano.php?lemma=BALUGINARE100');
  document.getElementById('olivetti').innerHTML = r2.ok
    ? `<span class="ok">✓ accesso diretto OK</span> (status ${r2.status}, ${r2.length} caratteri)`
    : `<span class="fail">✗ bloccato</span><pre>${r2.error}</pre>`;
}
</script>
</body>
</html>
